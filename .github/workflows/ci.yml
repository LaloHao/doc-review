name: CI

# TODO: pin every action by commit SHA (uses: owner/action@<sha> # vX). Not done
# yet: no SHAs were available offline (meeting-recorder's workflow uses tags too).

on:
  push:
    branches: [main]
    # A release: v<appVersion> pushes the image tag the chart uses by default.
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/doc-review --set publicUrl=https://revision.example.com --set envSecretName=doc-review-env --set migrations.adminSecretName=doc-review-db-admin
      - run: helm template t deploy/helm/doc-review --set publicUrl=https://revision.example.com --set envSecretName=doc-review-env --set migrations.adminSecretName=doc-review-db-admin --set networkPolicy.enabled=true > /dev/null
      - run: helm template t deploy/helm/doc-review --set publicUrl=https://revision.example.com --set database.type=embedded > /dev/null

  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox
      - run: make test-emacs

  image:
    needs: [test, emacs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        # Pull requests build the image to check it, but never publish it.
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          IMAGE=ghcr.io/lalohao/doc-review
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            APP=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/doc-review/Chart.yaml)
            if [ "$VERSION" != "$APP" ]; then echo "tag $GITHUB_REF_NAME != chart appVersion $APP" >&2; exit 1; fi
            echo "tags=$IMAGE:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:latest,$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
